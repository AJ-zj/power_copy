name: Sync Wiki

# 把主仓库 wiki/ 目录同步到 GitHub Wiki
#
# 触发条件：
#   - wiki/ 下有文件变更并推送到 main
#   - 手动触发（可勾选干跑模式）
#
# 前置要求：仓库需要配置 WIKI_TOKEN secret（Personal Access Token）
# 详见 wiki/README.md

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '干跑：只检查差异，不推送'
        type: boolean
        default: false

# 同一时刻只允许一个同步任务，避免并发推送冲突
concurrency:
  group: sync-wiki
  cancel-in-progress: true

jobs:
  sync:
    name: 同步 wiki/ 到 GitHub Wiki
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 检出主仓库
        uses: actions/checkout@v4

      - name: 检查 WIKI_TOKEN
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=缺少凭据::未配置 WIKI_TOKEN secret，无法推送 Wiki。请按 wiki/README.md 创建 PAT 并添加到仓库 Secrets。"
            exit 1
          fi
          echo "凭据已配置（长度 ${#TOKEN}）"

      - name: 克隆 Wiki 仓库
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            wiki-repo
          cd wiki-repo
          echo "当前分支: $(git rev-parse --abbrev-ref HEAD)"

      - name: 同步文件
        run: |
          # 清空旧内容，保留 .git
          find wiki-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # 复制 wiki/ 全部内容
          cp -a wiki/. wiki-repo/

          # README.md 是给主仓库看的发布说明，不发布到 Wiki
          rm -f wiki-repo/README.md

          echo "同步后内容："
          find wiki-repo -mindepth 1 -maxdepth 1 ! -name '.git' -printf '  %P\n' | sort

      - name: 检查差异
        id: diff
        working-directory: wiki-repo
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Wiki 已是最新，无变化"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到变化："
            git diff --cached --stat
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SHORT_SHA="${GITHUB_SHA::7}"
          git commit -m "docs: 从主仓库同步 wiki

          源提交: ${SHORT_SHA}
          触发: ${GITHUB_EVENT_NAME}"

          git push
          echo "推送完成: $(git rev-parse --short HEAD)"

      - name: 汇总
        run: |
          {
            echo "### Wiki 同步结果"
            echo ""
            if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                echo "- 模式：**干跑**（检测到变化，未推送）"
              else
                echo "- 模式：**已推送**"
                echo "- 源提交：\`${GITHUB_SHA::7}\`"
                echo "- Wiki：https://github.com/${GITHUB_REPOSITORY}/wiki"
              fi
            else
              echo "- **Wiki 已是最新，无需同步**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
